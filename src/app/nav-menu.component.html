@if (menuService.isOpen()) {
  <div
    class="menu-backdrop"
    (click)="close()"
    (keydown.escape)="close()"
    role="presentation"
    aria-hidden="true"
  ></div>

  <nav class="menu-drawer" role="navigation" aria-label="Main navigation menu">
    <div class="menu-header">
      <div class="menu-brand">
        
        <span class="brand-text">EIIP</span>
      </div>
      <button type="button" class="menu-close-btn" (click)="close()" aria-label="Close menu">
        ✕
      </button>
    </div>

    <div class="menu-section">
      <p class="menu-section-label">Menu</p>
      <ul class="menu-list">
        <li>
          <a class="menu-item" routerLink="/users" (click)="close()">
            <span class="menu-item-icon" aria-hidden="true">◷</span>
            Users
          </a>
        </li>
        <li>
          <a class="menu-item" routerLink="/inspection-overview" (click)="close()">
            <span class="menu-item-icon" aria-hidden="true">◦</span>
            Inspection Plan
          </a>
        </li>
        <li>
          <a class="menu-item" routerLink="/inspection-search" (click)="close()">
            <span class="menu-item-icon" aria-hidden="true">◦</span>
            Inspection Search
          </a>
        </li>
        <li>
          <a class="menu-item" routerLink="/candidates" (click)="close()">
            <span class="menu-item-icon" aria-hidden="true">◦</span>
            Candidates
          </a>
        </li>
        <li>
          <a class="menu-item" routerLink="/locations" (click)="close()">
            <span class="menu-item-icon" aria-hidden="true">◦</span>
            Locations
          </a>
        </li>
        <li class="menu-submenu">
          <div class="menu-item menu-parent-item" role="button" tabindex="0" aria-haspopup="true">
            <span class="menu-item-icon" aria-hidden="true">◦</span>
            <span class="menu-parent-label">Forms Mockups</span>
            <span class="menu-submenu-caret" aria-hidden="true">▸</span>
          </div>

          <ul class="menu-submenu-list" aria-label="Forms mockup layouts">
            <li>
              <a class="menu-item menu-submenu-item" routerLink="/forms-mockups/accordion" (click)="close()">
                Accordion Layout
              </a>
            </li>
            <li>
              <a class="menu-item menu-submenu-item" routerLink="/forms-mockups/modal" (click)="close()">
                Modal Layout
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </nav>
}
