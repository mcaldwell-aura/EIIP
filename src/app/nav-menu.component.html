@if (menuService.isOpen()) {
  <div
    class="menu-backdrop"
    (click)="close()"
    (keydown.escape)="close()"
    role="presentation"
    aria-hidden="true"
  ></div>

  <nav class="menu-drawer" role="navigation" aria-label="Main navigation menu">
    <div class="menu-header">
      <div class="menu-brand">
        
        <span class="brand-text">EIIP</span>
      </div>
      <button type="button" class="menu-close-btn" (click)="close()" aria-label="Close menu">
        ✕
      </button>
    </div>

    <div class="menu-section">
      <p class="menu-section-label">Menu</p>
      <ul class="menu-list">
        <li>
          <a class="menu-item" routerLink="/users" (click)="close()">
            <span class="menu-item-icon" aria-hidden="true">◷</span>
            Users
          </a>
        </li>
        <li>
          <a class="menu-item" routerLink="/inspection-overview" (click)="close()">
            <span class="menu-item-icon" aria-hidden="true">◦</span>
            Inspection Plan
          </a>
        </li>
        <li>
          <a class="menu-item" routerLink="/candidates" (click)="close()">
            <span class="menu-item-icon" aria-hidden="true">◦</span>
            Candidates
          </a>
        </li>
        <li>
          <a class="menu-item" routerLink="/locations" (click)="close()">
            <span class="menu-item-icon" aria-hidden="true">◦</span>
            Locations
          </a>
        </li>
      </ul>
    </div>
  </nav>
}
