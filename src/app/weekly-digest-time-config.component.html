<div class="details-page">
  <header class="top-nav">
    <div class="nav-left">
      <button
        pButton
        pRipple
        type="button"
        class="icon-btn"
        aria-label="Open menu"
        (click)="menuService.toggle()"
      >
        <i class="pi pi-bars"></i>
      </button>
      <a class="brand" routerLink="/">
        <span class="brand-text">EIIP</span>
      </a>
      <a class="nav-text-link" routerLink="/inspection-overview">Inspection Plan</a>
      <a class="nav-text-link" routerLink="/inspection-search">Inspection Search</a>
      <a class="nav-text-link" routerLink="/candidates">Candidates</a>
      <a class="nav-text-link" routerLink="/locations">Locations</a>
    </div>

    <div class="nav-right">
      <button pButton pRipple type="button" class="icon-btn" aria-label="Search">
        <i class="pi pi-search"></i>
      </button>
      <button pButton pRipple type="button" class="icon-btn" aria-label="Open apps">
        <i class="pi pi-th"></i>
      </button>
      <details class="profile-menu">
        <summary class="profile-btn profile-menu-trigger" aria-label="Profile actions">
          <i class="pi pi-user" aria-hidden="true"></i>
        </summary>
        <div class="profile-menu-panel" role="menu" aria-label="Profile menu">
          <a class="profile-menu-item" routerLink="/user-settings" role="menuitem">User Settings</a>
        </div>
      </details>
    </div>
  </header>

  <main class="details-main">
    <section class="page-header">
      <div class="title-wrap">
        <div>
          <h1>Weekly Digest Time Configuration</h1>
        </div>
        <div class="header-actions">
          <button pButton pRipple type="button" class="back-btn" (click)="navigateBack()">
            Back
          </button>
        </div>
      </div>
    </section>

    <div class="config-content">
      <article class="details-card config-card">
        <div class="card-header solo-header">
          <h2>Send Weekly Summary Email</h2>
        </div>

        <div class="summary-field-grid">
          <label class="summary-field">
            <span>Every</span>
            <p-select
              [(ngModel)]="selectedDay"
              [options]="daysOfWeek"
              [showClear]="false"
              appendTo="body"
            ></p-select>
          </label>

          <label class="summary-field">
            <span>At</span>
            <p-select
              [(ngModel)]="selectedTime"
              [options]="timeOptions"
              [showClear]="false"
              appendTo="body"
            ></p-select>
          </label>
        </div>

        <div class="summary-save-row">
          <button
            pButton
            pRipple
            type="button"
            label="Save"
            class="primary-btn"
            (click)="onSave()"
          ></button>
        </div>
      </article>
    </div>

    @if (showUnsavedModal()) {
      <app-unsaved-changes-confirmation-modal
        (save)="onSaveFromModal()"
        (discard)="onDiscardFromModal()"
        (cancel)="onCancelFromModal()"
      ></app-unsaved-changes-confirmation-modal>
    }
  </main>
</div>
